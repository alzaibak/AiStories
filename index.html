    <script>
      // Apply the reading appearance before first paint: saved choice first,
      // otherwise the system preference. Prevents a light flash for dark users.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('site-theme');
          if (saved === 'sepia') saved = 'reading';
          if (saved === 'light' || saved === 'reading' || saved === 'dark') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {
          theme = 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.siteTheme = theme;
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
      })();
    </script>
